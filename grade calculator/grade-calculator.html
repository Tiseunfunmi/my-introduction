<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>
</head>
<body>
    <h1 >Grade Calculator</h1>
    <label for="gradeInput">Enter your mark</label>
    <input type="number" id="gradeInput" placeholder="e.g 99">
    <button onclick="calculateGrade()">Check Grade</button>

    <p id="grade"></p>

    <script>
        function calculateGrade() {
            let grade = Number(document.getElementById('gradeInput').value)
            let message = ''

            if (grade >= 70) {
                message = 'You scored an A';
            } else if (grade >= 60) {
                message = 'You have a B';
            } else if (grade >= 50) {
                message = 'You have a C';
            } else {
                message = 'You got F!  You need to improve!';
            }
            document.getElementById('grade').textContent = message;

        }
       
        
    </script>
</body>
</html>
